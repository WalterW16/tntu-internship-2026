services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10251-10254:10251-10254"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=2
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -f https://localhost:8081/_explorer/emulator.pem || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  projects-api:
    build:
      context: .
      dockerfile: src/Projects.Api/Dockerfile
    ports:
      - "5001:8080"
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT:-https://cosmos-emulator:8081/}
      - CosmosDb__Key=${COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
      - CosmosDb__DatabaseName=${COSMOS_DATABASE:-TaskBoard}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000;
    depends_on:
      cosmos-emulator:
        condition: service_healthy 

  tasks-api:
    build:
      context: .
      dockerfile: src/Tasks.Api/Dockerfile
    ports:
      - "5002:8080"
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT:-https://cosmos-emulator:8081/}
      - CosmosDb__Key=${COSMOS_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
      - CosmosDb__DatabaseName=${COSMOS_DATABASE:-TaskBoard}
      - ProjectsApi__BaseUrl=http://projects-api:8080
      - APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000;
    depends_on:
      projects-api:
        condition: service_started
      cosmos-emulator:
        condition: service_healthy

volumes:
  cosmos-data: